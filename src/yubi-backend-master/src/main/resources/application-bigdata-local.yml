# 前置：项目根目录 docker compose -f docker-compose.bigdata.yml up -d
# 首次启用后调用：POST /api/bigdata/sync/metrics（登录后）
#
# 启动需带 profile：dev,bigdata-local（环境变量 SPRING_PROFILES_ACTIVE 或 IDE 配置）
# ClickHouse 24.8 官方镜像 default 用户密码为两个双引号字符 ""，不是空字符串，见 deploy.md

bigdata:
  enabled: true
  clickhouse:
    enabled: true
    prefer-read: true
    url: jdbc:clickhouse://127.0.0.1:8123/yubi_analytics
    username: default
    password: '""'
  kafka:
    enabled: true
    bootstrap-servers: localhost:9092
  sync:
    scheduled-enabled: false

storage:
  chartData:
    enabled: true

spring:
  kafka:
    bootstrap-servers: localhost:9092
