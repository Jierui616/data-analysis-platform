# todo 需替换配置
cos:
  client:
    accessKey: xxx
    secretKey: xxx
    region: xxx
    bucket: xxx
# 大数据栈（ClickHouse + Kafka + MinIO）。默认关闭；本地联调见 application-bigdata-local.yml.example
bigdata:
  enabled: false
  clickhouse:
    enabled: false
    prefer-read: true
    url: jdbc:ch://127.0.0.1:8123/yubi_analytics
    username: default
    password: ""
  kafka:
    enabled: false
    bootstrap-servers: localhost:9092
    topics:
      chart-gen-completed: yubi.chart.gen.completed
      import-completed: yubi.import.completed
  sync:
    scheduled-enabled: false
    cron: "0 0 2 * * ?"

# 图表原始 CSV 外置到对象存储（第一期）。默认关闭，行为与旧版一致。
# 开启前请在 MySQL 执行：src/yubi-backend-master/sql/chart_data_ref_alter.sql
# 本地 MinIO 见 docker-compose.bigdata.yml（API 端口 9100）；生产可设 provider: cos 使用上方 cos.client。
storage:
  chartData:
    enabled: false
    provider: minio
    keyPrefix: chart-data
  minio:
    endpoint: http://127.0.0.1:9100
    access-key: minioadmin
    secret-key: minioadmin123
    bucket: yubi-charts
# 阿里云百炼 DashScope（OpenAI 兼容接口）
# 控制台：https://bailian.console.aliyun.com/  → 创建 API Key
# 若报错「免费额度已用尽 / AllocationQuota.FreeTierOnly」：在控制台关闭「仅限免费额度」或为账户开通按量付费
dashscope:
  # 注意：冒号后面必须有空格，例如 api-key: sk-xxxx（写成 api-key:sk-xxxx 会整份 yml 解析失败）
  api-key: sk-d737d4f2cb744bbd85265efe26b123ec
  # 模型名以百炼控制台「OpenAI 兼容」文档为准，可换：qwen-turbo / qwen-plus / qwen-max / qwen-long / qwen2.5-7b-instruct 等
  model: qwen-plus-latest
# qwen3-32b qwen-max-2025-01-25 qwen-plus-2025-07-28 qwen2.5-vl-72b-instruct qwen-plus-latest

# BI Center：overview 结果缓存（命中可跳过查库 + CSV 解析 + 计算）
bicenter:
  cache:
    enabled: true
    ttl-seconds: 60
    # 预解析 Table 缓存（按 chartId 共享给三种 overview 视角），默认与 ttl-seconds 一致
    table-ttl-seconds: 60
    # 防止 Redis 存超大 JSON：chartData 字符数超过阈值则不缓存 Table，仅走原始解析
    max-table-bytes: 300000
  ai:
    # 运行分析（/ai/run）模型 ID。0 表示使用默认模型配置
    run:
      model-id: 0
      # 可选：指定百炼模型名；为空则沿用 dashscope.model
      dashscope-model:
    # 深度对话（/ai/deep-chat）模型 ID。可与 run 独立配置
    deep-chat:
      model-id: 0
      # 指定深度对话使用的百炼模型（与智能分析分开）
      dashscope-model: qwen-plus-latest
      # qwen-max qwen3.6-plus  qwen-plus-latest
      # 指定模型失败时，是否回退默认模型
      fallback-to-default: false
      session-ttl-seconds: 2592000

# AutoEDA 探索代理配置
autoeda:
  table-name: store_daily_metric
  ig:
    weight-coverage: 0.30
    weight-surprise: 0.35
    weight-lineage-depth: 0.20
    weight-cost: 0.15
    cost-max-rows: 5000000
  hypothesis:
    accept-threshold: 0.75
    reject-threshold: 0.25
    max-stale-rounds: 3