# 对象存储
# todo 需替换配置
cos:
  client:
    accessKey: xxx
    secretKey: xxx
    region: xxx
    bucket: xxx
# 大数据栈（ClickHouse + Kafka + MinIO）。默认关闭；本地联调见 application-bigdata-local.yml.example
bigdata:
  enabled: false
  clickhouse:
    enabled: false
    prefer-read: true
    url: jdbc:clickhouse://127.0.0.1:8123/yubi_analytics
    username: default
    # ClickHouse 24.8 官方镜像 default 用户密码为两个双引号字符 ""，见 deploy.md
    password: '""'
  kafka:
    enabled: false
    bootstrap-servers: localhost:9092
    topics:
      chart-gen-completed: yubi.chart.gen.completed
      import-completed: yubi.import.completed
  sync:
    scheduled-enabled: false
    cron: "0 0 2 * * ?"

# 图表原始 CSV 外置到对象存储（第一期）。默认关闭，行为与旧版一致。
# 开启前请在 MySQL 执行：src/yubi-backend-master/sql/chart_data_ref_alter.sql
# 本地 MinIO 见 docker-compose.bigdata.yml（API 端口 9100）；生产可设 provider: cos 使用上方 cos.client。
storage:
  chartData:
    enabled: false
    provider: minio
    keyPrefix: chart-data
  minio:
    endpoint: http://127.0.0.1:9100
    access-key: minioadmin
    secret-key: minioadmin123
    bucket: yubi-charts
# AI 模型配置：默认使用阿里云百炼 DashScope（OpenAI 兼容接口）
# 也可切换为本地 Ollama：ai.provider=ollama（需先启动 Ollama 并拉取模型）
ai:
  provider: dashscope   # dashscope | ollama

ollama:
  base-url: http://127.0.0.1:11434
  model: qwen2.5:7b
  # 当 Ollama 不可用时是否回退到 DashScope
  fallback-to-dashscope: true

# 阿里云百炼 DashScope（OpenAI 兼容接口，ai.provider=dashscope 时使用）
# 控制台：https://bailian.console.aliyun.com/ → 创建 API Key
dashscope:
  api-key: ${DASHSCOPE_API_KEY:}
  model: qwen-plus-latest

cors:
  allowed-origins:
    - http://localhost:8000
    - http://127.0.0.1:8000

# BI Center：overview 结果缓存（命中可跳过查库 + CSV 解析 + 计算）
bicenter:
  cache:
    enabled: true
    ttl-seconds: 60
    # 预解析 Table 缓存（按 chartId 共享给三种 overview 视角），默认与 ttl-seconds 一致
    table-ttl-seconds: 60
    # 防止 Redis 存超大 JSON：chartData 字符数超过阈值则不缓存 Table，仅走原始解析
    max-table-bytes: 300000
  ai:
    # 运行分析（/ai/run）模型 ID。0 表示使用默认模型配置
    run:
      model-id: 0
      # 可选：指定百炼模型名；为空则沿用 dashscope.model
      dashscope-model:
    # 深度对话（/ai/deep-chat）模型 ID。可与 run 独立配置
    deep-chat:
      model-id: 0
      # 指定深度对话使用的百炼模型（与智能分析分开）
      dashscope-model: qwen-plus-latest
      # qwen-max qwen3.6-plus  qwen-plus-latest
      # 指定模型失败时，是否回退默认模型
      fallback-to-default: false
      session-ttl-seconds: 2592000

# AutoEDA 探索代理配置
autoeda:
  table-name: yubi_analytics.store_daily_metric_ch
  ig:
    weight-coverage: 0.30
    weight-surprise: 0.35
    weight-lineage-depth: 0.20
    weight-cost: 0.15
    cost-max-rows: 5000000
    cost-fallback-rows: 100000
  # ── AIG: 自适应阶段感知 InfoGain ──
  aig:
    # BROAD_SWEEP 广度扫描阶段权重
    sweep:
      coverage: 0.50
      surprise: 0.15
      lineage: 0.15
      cost: 0.20
    # DEEP_DRILL 深度下钻阶段权重
    drill:
      coverage: 0.10
      surprise: 0.35
      lineage: 0.40
      cost: 0.15
    # VERIFICATION 验证收敛阶段权重
    verify:
      coverage: 0.05
      surprise: 0.25
      lineage: 0.50
      cost: 0.20
    # 阶段切换阈值
    phase-sweep-min-verified: 3
    phase-sweep-budget-ratio: 0.33
    phase-verify-budget-ratio: 0.80
  # ── EHIG: 期望假设信息增益 ──
  ehig:
    evidence-steps: 3
    relevance-threshold: 0.15
    confidence-floor: 0.25
  hypothesis:
    accept-threshold: 0.60
    reject-threshold: 0.25
    max-stale-rounds: 3
    verify-enabled: false
    verify-top-k: 2
    # 批跑实验：关闭 LLM 假设生成，用规则假设 + Bayesian，避免 DashScope 长时间阻塞
    use-llm-generation: false
  report:
    use-llm: false
  experiment:
    candidate-pool-size: 8
    export-dir: experiments/out
    # 选查询前对候选 SQL 执行 EXPLAIN ESTIMATE，写入 IG 的 Cost 分项
    use-explain-cost: false
