spring:
  application:
    name: yubi-backend
  # 关闭启动横幅（不再打印 classpath 内 banner.txt / Spring 默认 ASCII 图）
  main:
    banner-mode: off
  # 默认 dev 环境
  profiles:
    active: dev
  # 支持 swagger3
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  # session 配置
  session:
    # todo 取消注释开启分布式 session（须先配置 Redis）
    # store-type: redis
    # 30 天过期
    timeout: 2592000
  # 数据库配置
  # 三个 MySQL 库：yubi（主库）、yubi_restaurant（餐饮）、yubi_risk（风险画像）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/yubi
    username: root
    password: ${MYSQL_PASSWORD:}
    # 餐饮模块独立库（表由 sql/03_init_yubi_restaurant.sql 创建）
    restaurant:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://localhost:3306/yubi_restaurant
      username: root
      password: ${RESTAURANT_MYSQL_PASSWORD:${MYSQL_PASSWORD:}}
    # 风险画像独立库（表由 sql/04_init_yubi_risk.sql 创建）
    risk:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://localhost:3306/yubi_risk
      username: root
      password: ${RISK_MYSQL_PASSWORD:${MYSQL_PASSWORD:}}
  # Redis 配置
  # todo 需替换配置，然后取消注释
  redis:
    database: 1
    host: localhost
    port: 6379
    timeout: 5000
  # Elasticsearch 配置
  # todo 需替换配置，然后取消注释
#  elasticsearch:
#    uris: http://localhost:9200
#    username: root
#    password: 123456
  # 文件上传
  servlet:
    multipart:
      # 大小限制
      max-file-size: 10MB
  rabbitmq:
    host: localhost
    port: 5672
    password: guest
    username: guest
server:
  address: 0.0.0.0
  # 与前端 dev 代理（proxy.ts）、OpenAPI 地址一致；如需改端口请同步修改 src/yubi-frontend-master/config/proxy.ts
  port: 18080
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000
# 风险画像：member-demo-mode / anonymous-demo-mode=true 使用演示兜底；导入后改为 false，仅从对应 risk_portrait_* 表读取（无兜底）。
risk-portrait:
  member-demo-mode: true
  anonymous-demo-mode: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除的实体字段名
      logic-delete-value: 1 # 逻辑已删除值（默认为 1）
      logic-not-delete-value: 0 # 逻辑未删除值（默认为 0）
