# 本地大数据栈：ClickHouse（OLAP）+ Kafka（事件流）+ MinIO（对象存储）
# 用法（在项目根目录）：docker compose -f docker-compose.bigdata.yml up -d
# 与 MySQL 主库独立；后端通过 profile bigdata-local 接入，见 deploy.md

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: yubi-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  clickhouse-init:
    image: clickhouse/clickhouse-server:24.8
    container_name: yubi-clickhouse-init
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - ./src/yubi-backend-master/sql/clickhouse:/init:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - clickhouse-client --host clickhouse --multiquery < /init/01_init_analytics.sql
    restart: "no"

  kafka:
    image: apache/kafka:3.7.0
    container_name: yubi-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s

  minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    container_name: yubi-minio
    command: server /data --console-address ":9001"
    ports:
      - "9100:9000"
      - "9101:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  clickhouse_data:
  minio_data:
